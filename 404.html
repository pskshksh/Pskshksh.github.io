<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Ayoub Idel</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <style>
        .error-page { min-height: 100svh; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--gutter); }
        .error-content { max-width: 520px; }
        .error-code {
            font-family: var(--font-display); font-weight: 700;
            font-size: clamp(6rem, 22vw, 13rem); line-height: 0.9; letter-spacing: -0.04em;
            background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .error-title { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; margin-top: 0.5rem; }
        .error-message { color: var(--text-dim); margin-top: 1rem; }
        .error-terminal {
            background: var(--surface); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 1.2rem 1.4rem; text-align: left;
            margin: 2rem 0; font-family: var(--font-mono); font-size: 0.9rem;
        }
        .error-terminal div { color: var(--text-dim); margin-bottom: 0.5rem; }
        .error-terminal div:last-child { margin-bottom: 0; }
        .prompt { color: var(--teal); }
        .err { color: #ef6b6b; }
        .cursor { color: var(--amber); animation: blink 1.05s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1 class="error-title">Page not found</h1>
            <p class="error-message">You've wandered off the map. This route doesn't exist — or it moved somewhere new.</p>

            <div class="error-terminal">
                <div><span class="prompt">$</span> cd /requested-page</div>
                <div><span class="err">error: ENOENT — no such file or directory</span></div>
                <div><span class="prompt">$</span> <span class="cursor">▌</span></div>
            </div>

            <a href="/" class="btn btn-primary btn-lg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Back home
            </a>
        </div>
    </main>
</body>
</html>
